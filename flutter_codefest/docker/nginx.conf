server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location = /healthz {
        proxy_pass http://api:8080/healthz;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location = /flutter_service_worker.js {
        expires -1;
        try_files $uri =404;
    }

    location = /flutter_bootstrap.js {
        expires -1;
        try_files $uri =404;
    }

    location = /version.json {
        expires -1;
        try_files $uri =404;
    }

    location = /build-info.json {
        expires -1;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    # nginx defaults gzip_proxied to off, which — despite "gzip on" above —
    # silently skips compression for anything that came from proxy_pass
    # (i.e. every /api/* response). Confirmed by measurement: /shelters
    # nationwide is 4.06 MB uncompressed, ~470 KB gzipped — an ~9x difference
    # this config was leaving on the table for every single API response.
    gzip_proxied any;
}
