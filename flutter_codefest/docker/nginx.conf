server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location = /healthz {
        proxy_pass http://api:8080/healthz;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /app/index.html {
        expires -1;
        try_files $uri =404;
    }

    location = /app/flutter_service_worker.js {
        expires -1;
        try_files $uri =404;
    }

    location = /app/flutter_bootstrap.js {
        expires -1;
        try_files $uri =404;
    }

    location = /app/version.json {
        expires -1;
        try_files $uri =404;
    }

    location = /app/build-info.json {
        expires -1;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Flutter Web app (SPA) lives under /app/; unknown sub-paths fall back to
    # its index.html so client-side routing still works.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # Promotional landing page at the root.
    location / {
        try_files $uri $uri/ =404;
    }

    # nginx's bundled mime.types has no entry for .ttf/.otf, so without this
    # they're served as application/octet-stream and never match gzip_types
    # below regardless of what's listed there. NotoSansTC.ttf is ~12MB and
    # ships uncompressed as a result — this was measured as a real bottleneck
    # on slow networks (see e2e low-speed-network test).
    location ~* \.(?:ttf|otf)$ {
        types {
            font/ttf ttf;
            font/otf otf;
        }
        try_files $uri =404;
    }

    gzip on;
    # Alpine's bundled mime.types serves .ttf as application/octet-stream,
    # so include that fallback as well as the standard font media types.
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml font/ttf font/otf application/vnd.ms-fontobject application/octet-stream;
    # nginx defaults gzip_proxied to off, which — despite "gzip on" above —
    # silently skips compression for anything that came from proxy_pass
    # (i.e. every /api/* response). Confirmed by measurement: /shelters
    # nationwide is 4.06 MB uncompressed, ~470 KB gzipped — an ~9x difference
    # this config was leaving on the table for every single API response.
    gzip_proxied any;
}
