<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="description"
      content="全國避難設施地圖、災害類型篩選與鄰近收容處所查詢"
    />
    <meta name="theme-color" content="#5AB4C5" />
    <!--
      No map SDK is loaded here.

      The map is rendered by flutter_map against the 內政部國土測繪中心 WMTS
      tile service, which needs no API key and no third-party script. That is
      deliberate: the previous Google Maps setup meant a fresh clone showed a
      blank page until someone supplied a billed API key.

      The standalone container uses same-origin /api. Local Flutter development
      can still point directly at the Dart server:
        flutter run -d chrome --dart-define=API_BASE_URL=http://localhost:8080/api
    -->
    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="全國避難設施地圖" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <title>臺灣避難收容所資訊整合系統</title>
    <link rel="manifest" href="manifest.json" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #f7fbfc;
      }

      #app-loading {
        box-sizing: border-box;
        display: grid;
        min-height: 100%;
        place-content: center;
        justify-items: center;
        gap: 14px;
        padding: 24px;
        color: #174b57;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        text-align: center;
      }

      .app-loading__mark {
        display: grid;
        width: 56px;
        height: 56px;
        place-items: center;
        border-radius: 18px;
        background: #5ab4c5;
        color: #ffffff;
        font-size: 28px;
        box-shadow: 0 8px 24px rgb(23 75 87 / 18%);
      }

      .app-loading__title {
        font-size: 20px;
        font-weight: 700;
      }

      .app-loading__status {
        color: #50676c;
        font-size: 14px;
      }

      .app-loading__spinner {
        width: 24px;
        height: 24px;
        border: 3px solid rgb(90 180 197 / 25%);
        border-top-color: #278da1;
        border-radius: 50%;
        animation: loading-spin 0.8s linear infinite;
      }

      @keyframes loading-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-loading__spinner {
          animation-duration: 1.8s;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-loading" role="status" aria-live="polite">
      <div class="app-loading__mark" aria-hidden="true">◈</div>
      <div class="app-loading__title">TESIIS 臺灣避難收容所地圖</div>
      <div class="app-loading__spinner" aria-hidden="true"></div>
      <div class="app-loading__status">正在載入地圖與避難所資料…</div>
    </div>
    <script src="flutter_bootstrap.js" defer></script>
  </body>
</html>
