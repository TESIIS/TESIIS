<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="description"
      content="全國避難設施地圖、災害類型篩選與鄰近收容處所查詢"
    />
    <meta name="theme-color" content="#5AB4C5" />
    <!--
      No map SDK is loaded here.

      The map is rendered by flutter_map against the 內政部國土測繪中心 WMTS
      tile service, which needs no API key and no third-party script. That is
      deliberate: the previous Google Maps setup meant a fresh clone showed a
      blank page until someone supplied a billed API key.

      The standalone container uses same-origin /api. Local Flutter development
      can still point directly at the Dart server:
        flutter run -d chrome --dart-define=API_BASE_URL=http://localhost:8080/api
    -->
    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="全國避難設施地圖" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <title>臺灣避難收容所資訊整合系統</title>
    <link rel="manifest" href="manifest.json" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #e7f3f5;
      }

      #app-loading {
        box-sizing: border-box;
        display: grid;
        min-height: 100%;
        overflow: hidden;
        position: relative;
        color: #174b57;
        font-family: "Noto Sans TC", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .app-loading__map {
        background-color: #e7f3f5;
        background-image: linear-gradient(rgb(0 104 116 / 8%) 1px, transparent 1px),
          linear-gradient(90deg, rgb(0 104 116 / 8%) 1px, transparent 1px);
        background-size: 32px 32px;
        inset: 0;
        position: absolute;
      }

      .app-loading__map::before,
      .app-loading__map::after {
        border-radius: 50%;
        content: "";
        left: 50%;
        position: absolute;
        top: 42%;
        translate: -50% -50%;
      }

      .app-loading__map::before {
        animation: loading-pulse 2.2s ease-out infinite;
        border: 2px solid rgb(0 104 116 / 32%);
        height: 116px;
        width: 116px;
      }

      .app-loading__map::after {
        background: #006874;
        border: 5px solid #a6effd;
        box-shadow: 0 2px 8px rgb(0 78 88 / 28%);
        height: 18px;
        width: 18px;
      }

      .app-loading__panel {
        align-self: end;
        background: #fbfcfc;
        border-radius: 20px 20px 0 0;
        box-shadow: 0 -6px 24px rgb(22 37 39 / 18%);
        box-sizing: border-box;
        display: grid;
        gap: 16px;
        padding: 12px 24px max(28px, env(safe-area-inset-bottom, 0px));
        position: relative;
        width: 100%;
      }

      .app-loading__handle {
        background: #b9c7c9;
        border-radius: 99px;
        height: 4px;
        justify-self: center;
        width: 36px;
      }

      .app-loading__heading {
        align-items: center;
        display: flex;
        gap: 14px;
      }

      .app-loading__mark {
        display: grid;
        flex: none;
        height: 48px;
        place-items: center;
        width: 48px;
        border-radius: 14px;
        background: #5ab4c5;
        color: #ffffff;
        font-size: 24px;
        box-shadow: 0 4px 12px rgb(23 75 87 / 20%);
      }

      .app-loading__title {
        font-size: 17px;
        font-weight: 700;
        line-height: 1.4;
      }

      .app-loading__status {
        color: #50676c;
        font-size: 14px;
        line-height: 1.6;
      }

      .app-loading__progress {
        background: #d7e6e8;
        border-radius: 99px;
        height: 4px;
        overflow: hidden;
      }

      .app-loading__progress::before {
        animation: loading-progress 1.7s ease-in-out infinite;
        background: #006874;
        border-radius: inherit;
        content: "";
        display: block;
        height: 100%;
        width: 42%;
      }

      @keyframes loading-pulse {
        0% {
          opacity: 0;
          transform: scale(0.45);
        }
        20% {
          opacity: 0.8;
        }
        100% {
          opacity: 0;
          transform: scale(1.35);
        }
      }

      @keyframes loading-progress {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(270%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-loading__map::before,
        .app-loading__progress::before {
          animation: none;
        }
        .app-loading__progress::before {
          transform: translateX(70%);
        }
      }

      @media (max-width: 699px) {
        .app-loading__panel {
          gap: 22px;
          min-height: 280px;
          padding: 20px 28px max(40px, env(safe-area-inset-bottom, 0px));
        }

        .app-loading__handle {
          height: 5px;
          width: 48px;
        }

        .app-loading__heading {
          gap: 18px;
        }

        .app-loading__mark {
          border-radius: 18px;
          font-size: 32px;
          height: 64px;
          width: 64px;
        }

        .app-loading__title {
          font-size: 21px;
        }

        .app-loading__status {
          font-size: 16px;
        }

        .app-loading__progress {
          height: 6px;
        }
      }

      @media (min-width: 700px) {
        #app-loading {
          padding: 32px;
          place-items: center;
        }

        .app-loading__map::before,
        .app-loading__map::after {
          top: 50%;
        }

        .app-loading__panel {
          align-self: center;
          border-radius: 16px;
          box-shadow: 0 10px 28px rgb(22 37 39 / 20%);
          padding: 28px;
          width: min(360px, 100%);
        }

        .app-loading__handle {
          display: none;
        }

        .app-loading__title {
          font-size: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-loading" role="status" aria-live="polite">
      <div class="app-loading__map" aria-hidden="true"></div>
      <div class="app-loading__panel">
        <div class="app-loading__handle" aria-hidden="true"></div>
        <div class="app-loading__heading">
          <div class="app-loading__mark" aria-hidden="true">◈</div>
          <div class="app-loading__title">TESIIS 臺灣避難收容所地圖</div>
        </div>
        <div class="app-loading__progress" aria-hidden="true"></div>
        <div class="app-loading__status">正在載入地圖與避難所資料…</div>
      </div>
    </div>
    <script src="flutter_bootstrap.js" defer></script>
  </body>
</html>
