name: Upstream data check

# The whole system rests on assumptions about datasets published by other
# agencies: which columns exist, which values appear in the hazard columns, and
# how many records there are. Those change without notice, and when they do the
# failure is silent — filters quietly return nothing, or the coordinate join
# stops matching. This job notices instead.

on:
  schedule:
    # Mondays 01:00 UTC (09:00 Taipei).
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-nationwide:
    name: verify nationwide snapshot (primary data source)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get

      # build_nationwide_snapshot.dart carries its own quality gates (all 22
      # counties represented, ≥95% overall accept ratio, ≥75% per county —
      # see _checkGates in the tool) and exits non-zero when one fails, so
      # this step alone is the coverage-regression check. --refresh forces a
      # live pull rather than reusing tool/.cache/, since the whole point is
      # to notice when upstream itself has changed.
      - name: Rebuild nationwide snapshot from live data
        run: |
          dart run tool/build_nationwide_snapshot.dart \
            --refresh --report \
            --output /tmp/shelters_nationwide.csv \
            --rejected-output /tmp/shelters_rejected.csv \
            | tee /tmp/nationwide-report.txt

      - name: Diff against the committed snapshot
        run: |
          if diff -q data/shelters_nationwide.csv /tmp/shelters_nationwide.csv > /dev/null; then
            echo "Committed nationwide snapshot is up to date."
          else
            echo "::warning::Upstream nationwide data has changed. Run:"
            echo "  cd server && dart run tool/build_nationwide_snapshot.dart --refresh --report"
            diff data/shelters_nationwide.csv /tmp/shelters_nationwide.csv | head -40 || true
          fi

      - name: Upload report and rejected rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nationwide-snapshot-report
          path: |
            /tmp/nationwide-report.txt
            /tmp/shelters_rejected.csv
          retention-days: 90

  check:
    name: verify upstream schema and coverage (臺北市 secondary pipeline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get

      # Rebuilds the coordinate table from live upstream data into a scratch
      # path, leaving the committed table untouched. A drop in coverage or a
      # schema change shows up in the report.
      - name: Rebuild coordinate table from live data
        run: |
          dart run tool/build_coordinates.dart \
            --refresh --report \
            --output /tmp/shelter_coordinates.csv | tee /tmp/report.txt

      - name: Fail if coverage regressed
        run: |
          set -euo pipefail
          coverage=$(grep -oE 'With coordinates:.*\(([0-9.]+)%\)' /tmp/report.txt \
                     | grep -oE '[0-9.]+%' | tr -d '%')
          echo "Live coverage: ${coverage}%"
          # The committed table sits at ~92.3%; anything under 85% means
          # upstream changed in a way that broke the address join.
          awk -v c="$coverage" 'BEGIN { exit (c >= 85) ? 0 : 1 }' \
            || { echo "::error::Coordinate coverage fell to ${coverage}%"; exit 1; }

      - name: Diff against the committed table
        run: |
          if diff -q data/shelter_coordinates.csv /tmp/shelter_coordinates.csv > /dev/null; then
            echo "Committed coordinate table is up to date."
          else
            echo "::warning::Upstream data has changed. Run:"
            echo "  cd server && dart run tool/build_coordinates.dart --refresh --report"
            diff data/shelter_coordinates.csv /tmp/shelter_coordinates.csv | head -40 || true
          fi
