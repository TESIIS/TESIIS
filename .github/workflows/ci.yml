name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: server (Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart format --output=none --set-exit-if-changed .
      # No network in the test suite: the upstream OpenData API would make CI
      # flaky and would hammer a public service on every push. Fixtures and a
      # MockClient stand in for it. The one file-system dependency is the
      # committed coordinate table, which is exactly what we want guarded.
      - run: dart test

  flutter:
    name: flutter_codefest (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_codefest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter test
      # Proves the web target still compiles. No API key is needed — that is
      # the point of the NLSC basemap.
      - run: flutter build web --dart-define=API_BASE_URL=/api

  containers:
    name: Docker Compose build
    runs-on: ubuntu-latest
    needs: [server, flutter]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose build

  # Publishes multi-arch (amd64+arm64) images to GHCR on every push to
  # master, so the VPS can `docker pull` a prebuilt image instead of
  # rebuilding from source on every deploy (see deploy.yml).
  #
  # Deliberately part of this workflow rather than a separate one:
  # deploy.yml triggers off `workflow_run` of this whole workflow completing,
  # so folding image publishing in here via `needs:` guarantees the images
  # exist in GHCR before deploy tries to pull them. Two independently
  # `workflow_run`-triggered workflows would race instead.
  #
  # Builds each architecture on a *native* runner rather than emulating with
  # QEMU: server/Dockerfile's `dart compile exe` is an AOT compile, which is
  # known to be slow/unreliable under emulation. `ubuntu-24.04-arm` is a
  # GitHub-hosted arm64 runner, free for public repos (this one is public) —
  # no self-hosted runner or QEMU setup needed.
  publish-images:
    name: publish ${{ matrix.image }} (${{ matrix.platform }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [containers]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            context: ./server
            runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - image: server
            context: ./server
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
          - image: web
            context: ./flutter_codefest
            runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
            build-args: API_BASE_URL=/api
          - image: web
            context: ./flutter_codefest
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
            build-args: API_BASE_URL=/api
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # push-by-digest: this pushes one single-arch image identified only by
      # its content digest, not a human tag yet — merge-manifests below
      # combines the amd64 and arm64 digests into one multi-arch tag.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platform }}
          build-args: |
            ${{ matrix.build-args }}
            BUILD_SHA=${{ github.sha }}
          outputs: type=image,name=ghcr.io/tesiis/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines each image's amd64 + arm64 digests (from publish-images) into
  # one multi-arch manifest list per image, tagged `latest` and `sha-<short>`.
  merge-manifests:
    name: merge manifest (${{ matrix.image }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [publish-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [server, web]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/tesiis/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          tag_args=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digest_refs=$(printf 'ghcr.io/tesiis/${{ matrix.image }}@sha256:%s ' *)
          docker buildx imagetools create $tag_args $digest_refs

      - name: Inspect the published manifest
        run: docker buildx imagetools inspect ghcr.io/tesiis/${{ matrix.image }}:latest

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [containers]
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Runs against the real stack, not a mock: Nginx + API + Flutter Web,
      # same as `docker compose up --build` in the README.
      - name: Start the stack
        working-directory: .
        run: docker compose up -d --build

      - name: Wait for /healthz
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/healthz; then exit 0; fi
            sleep 2
          done
          echo "::error::Stack did not become healthy in time"
          exit 1

      - run: npx playwright test

      - name: Dump container logs on failure
        if: failure()
        working-directory: .
        run: docker compose logs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Tear down
        if: always()
        working-directory: .
        run: docker compose down -v

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan commits, not just the tree.
          fetch-depth: 0
      # gitleaks-action@v2 now requires a commercial license. Keep the scan
      # free and reproducible by using the last MIT-licensed CLI release.
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.18.4
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output /tmp/gitleaks.tar.gz
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /tmp
          install --mode=0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan Git history for secrets
        run: gitleaks detect --source . --no-banner --redact

      # Belt and braces: fail if a file that must never ship gets committed,
      # even if it contains nothing gitleaks recognises as a secret.
      - name: Forbidden files
        run: |
          set -euo pipefail
          matches=$(git ls-files \
            | grep -Ei '(^|/)\.env$|(^|/)\.env\..*|\.db$|\.sqlite3?$|\.keystore$|\.jks$|\.p12$|\.pem$|\.mobileprovision$|google-services\.json$|GoogleService-Info\.plist$|local\.properties$' \
            | grep -v '\.env\.example$' || true)
          if [ -n "$matches" ]; then
            echo "::error::These files must not be committed (see CONTRIBUTING.md):"
            echo "$matches"
            exit 1
          fi
          echo "No forbidden files in version control."
