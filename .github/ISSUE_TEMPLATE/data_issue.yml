name: 資料錯誤回報
description: 避難所位置標錯、資訊有誤、或某個設施沒出現在地圖上
labels: [data]
body:
  - type: markdown
    attributes:
      value: |
        本專案的資料來自內政部消防署「[避難收容處所點位檔](https://data.gov.tw/dataset/73242)」，
        全國 22 縣市共 5,854 筆通過驗證的設施。**名稱、地址、座標、容納人數、聯絡人等欄位本專案不修改。**
        這類錯誤請直接向資料提供機關反映。

        本專案會做的事只有一件：以各縣市地理範圍逐筆檢查座標，把落在錯誤縣市、
        海上或預設位置的資料排除掉（目前 119 筆，見 `server/data/shelters_rejected.csv`）。
        **設施在地圖上完全找不到，最可能就是被這道閘門擋掉了。**

        授權與資料品質細節見 [NOTICE.md](../blob/master/NOTICE.md)。

  - type: input
    id: shelter-code
    attributes:
      label: 收容所編號
      description: 在避難所詳細資訊面板可以看到，或從 API 的 `收容所編號` 欄位取得。
      placeholder: NFA-TPE-013f9700229ebca3
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: 名稱
      placeholder: 中正國小
    validations:
      required: true

  - type: input
    id: city
    attributes:
      label: 縣市與鄉鎮市區
      placeholder: 臺北市 中山區
    validations:
      required: true

  - type: dropdown
    id: problem
    attributes:
      label: 問題類型
      options:
        - 地圖上完全沒有這個設施
        - 位置標到錯誤的縣市或海上
        - 位置偏移（標記不在實際設施上）
        - 欄位資訊有誤（容納人數、適用災害、室內外等）
        - 其他
    validations:
      required: true

  - type: input
    id: correct-coords
    attributes:
      label: 正確座標（如果知道）
      description: |
        格式為 `經度, 緯度`（WGS84 十進位度）。可從任何公開地圖右鍵取得。
        座標事實本身不受著作權保護，但請不要直接複製有授權限制的資料庫內容。
      placeholder: '121.5265, 25.0190'

  - type: textarea
    id: app-notice
    attributes:
      label: App 顯示的座標提示
      description: 詳細資訊面板上方是否有橘色或黃色提示？請貼上內容。
      placeholder: 此位置為概略值(依鄰近門牌推估)，實際入口可能相差數百公尺。
