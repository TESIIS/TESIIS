name: taipei-shelter-web

services:
  api:
    # `image:` alongside `build:` lets the same file serve two paths:
    # `docker compose up --build` (this file's documented dev/local flow)
    # always builds fresh from source and tags the result with this name;
    # `docker compose pull` (used by deploy.yml on the VPS) fetches the
    # prebuilt multi-arch image from GHCR instead, with no local build.
    image: ghcr.io/tesiis/server:latest
    build:
      context: ./server
    environment:
      PORT: "8080"
      SNAPSHOT_CSV: data/shelters_nationwide.csv
      CACHE_TTL_SECONDS: "600"
      LOG_LEVEL: info
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

  web:
    image: ghcr.io/tesiis/web:latest
    build:
      context: ./flutter_codefest
      args:
        API_BASE_URL: /api
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
