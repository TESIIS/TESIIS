name: server
description: >-
  HTTP API for the 臺北市避難設施查詢系統. Proxies the Taipei OpenData
  可供避難收容處所 dataset and joins in the coordinates it does not provide.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.9.2

dependencies:
  http: ^1.5.0
  shelf: ^1.4.0
  shelf_router: ^1.0.0
  shelf_cors_headers: ^0.1.5
  get_it: ^9.0.5
  logging: ^1.2.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
